<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nadzorna plošča — Admin Zarja</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">

<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar__brand">
      <img src="../img/zarja_logo.png" alt="Zarja">
      <span class="tag">Admin</span>
    </div>
    <nav class="admin-nav">
      <ul>
        <li><a href="index.html" class="active"><span class="icon">⌂</span>Nadzorna plošča</a></li>
        <li><a href="predstave.html"><span class="icon">🎭</span>Predstave</a></li>
        <li><a href="termini.html"><span class="icon">📅</span>Termini</a></li>
        <li><a href="ansambel.html"><span class="icon">👥</span>Članstvo</a></li>
        <li><a href="nagrade.html"><span class="icon">🏆</span>Nagrade</a></li>
        <li><a href="sponzorji.html"><span class="icon">💎</span>Sponzorji</a></li>
        <li><a href="rezervacije.html"><span class="icon">🎟</span>Rezervacije</a></li>
        <li><a href="nastavitve.html"><span class="icon">⚙</span>Nastavitve</a></li>
        <li><a href="skrbniki.html"><span class="icon">🔑</span>Skrbniki</a></li>
      </ul>
    </nav>
    <div class="admin-sidebar__footer">
      <div class="admin-user">Prijavljen kot:<br><strong id="adminUserEmail">…</strong></div>
      <button onclick="admin.signOut()">Odjava</button>
    </div>
  </aside>

  <!-- Content -->
  <main class="admin-content">
    <div class="admin-header">
      <div>
        <h1>Nadzorna plošča</h1>
        <p class="sub">Pregled in upravljanje vsebine Gledališča Zarja Celje.</p>
      </div>
      <a href="../index.html" target="_blank" class="btn btn--secondary">Odpri spletno stran ↗</a>
    </div>

    <div class="dash-grid" id="dashGrid">
      <div class="dash-card" style="grid-column:1/-1; text-align:center; color:var(--c-muted);">Nalagam …</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
<script>
(async function() {
  const user = await admin.init();
  if (!user) return;

  // Fetch counts in parallel
  const [showsRes, perfRes, ensRes, awardsRes, sponsorsRes] = await Promise.all([
    sb.from('shows').select('id', { count: 'exact', head: true }),
    sb.from('performances').select('id', { count: 'exact', head: true }).gte('performance_date', new Date().toISOString().slice(0,10)),
    sb.from('ensemble_members').select('id', { count: 'exact', head: true }).eq('active', true),
    sb.from('awards').select('id', { count: 'exact', head: true }),
    sb.from('sponsors').select('id', { count: 'exact', head: true }).eq('active', true),
  ]);

  const cards = [
    { href: 'predstave.html',   title: 'Predstave',  sub: 'Upravljaj predstave in cene',   count: showsRes.count   ?? '–' },
    { href: 'termini.html',     title: 'Termini',    sub: 'Prihajajoči datumi predstav',   count: perfRes.count    ?? '–' },
    { href: 'ansambel.html',    title: 'Članstvo',   sub: 'Aktivni člani in članice',      count: ensRes.count     ?? '–' },
    { href: 'nagrade.html',     title: 'Nagrade',    sub: 'Vse priznane nagrade',           count: awardsRes.count  ?? '–' },
    { href: 'sponzorji.html',   title: 'Sponzorji',  sub: 'Aktivni sponzorji in pokrovitelji', count: sponsorsRes.count ?? '–' },
    { href: 'nastavitve.html',  title: 'Nastavitve', sub: 'Kontaktni podatki, naslovi, hero', count: null },
  ];

  document.getElementById('dashGrid').innerHTML = cards.map(c => `
    <a href="${c.href}" class="dash-card">
      <div class="dash-card__title">${c.title}</div>
      <p class="dash-card__sub">${c.sub}</p>
      ${c.count !== null ? `<div class="dash-card__num">${c.count}</div>` : ''}
    </a>
  `).join('');
})();
</script>

</body>
</html>
