<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termini — Admin Zarja</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__brand">
      <img src="../img/zarja_logo.png" alt="Zarja"><span class="tag">Admin</span>
    </div>
    <nav class="admin-nav">
      <ul>
        <li><a href="index.html"><span class="icon">⌂</span>Nadzorna plošča</a></li>
        <li><a href="predstave.html"><span class="icon">🎭</span>Predstave</a></li>
        <li><a href="termini.html" class="active"><span class="icon">📅</span>Termini</a></li>
        <li><a href="ansambel.html"><span class="icon">👥</span>Članstvo</a></li>
        <li><a href="nagrade.html"><span class="icon">🏆</span>Nagrade</a></li>
        <li><a href="sponzorji.html"><span class="icon">💎</span>Sponzorji</a></li>
        <li><a href="rezervacije.html"><span class="icon">🎟</span>Rezervacije</a></li>
        <li><a href="nastavitve.html"><span class="icon">⚙</span>Nastavitve</a></li>
        <li><a href="skrbniki.html"><span class="icon">🔑</span>Skrbniki</a></li>
      </ul>
    </nav>
    <div class="admin-sidebar__footer">
      <div class="admin-user">Prijavljen kot:<br><strong id="adminUserEmail">…</strong></div>
      <button onclick="admin.signOut()">Odjava</button>
    </div>
  </aside>

  <main class="admin-content">
    <div id="listView">
      <div class="admin-header">
        <div><h1>Termini</h1><p class="sub">Razpored predstav po datumih.</p></div>
        <button class="btn btn--primary" onclick="openEditForm()">+ Nov termin</button>
      </div>

      <div class="toolbar">
        <select class="toolbar__search" style="flex:0 0 260px;" id="showFilter">
          <option value="">Vse predstave</option>
        </select>
        <select class="toolbar__search" style="flex:0 0 180px;" id="statusFilter">
          <option value="">Vsi statusi</option>
          <option value="scheduled">Načrtovano</option>
          <option value="sold_out">Razprodano</option>
          <option value="cancelled">Odpovedano</option>
        </select>
        <select class="toolbar__search" style="flex:0 0 180px;" id="rangeFilter">
          <option value="upcoming">Samo prihajajoči</option>
          <option value="all">Vsi (tudi pretekli)</option>
        </select>
      </div>

      <table class="data-table">
        <thead><tr>
          <th>Datum</th><th>Ura</th><th>Predstava</th><th>Status</th><th>Opomba</th><th class="actions">&nbsp;</th>
        </tr></thead>
        <tbody id="rowsBody"><tr><td colspan="6" class="empty">Nalagam …</td></tr></tbody>
      </table>
    </div>

    <div id="editView" class="hide">
      <div class="admin-header">
        <div><h1 id="editTitle">Nov termin</h1></div>
        <button class="btn btn--secondary" onclick="showList()">← Nazaj</button>
      </div>

      <form id="editForm" class="admin-form" onsubmit="saveRow(event)">
        <input type="hidden" id="fieldId">

        <div class="form-row">
          <label>Predstava *</label>
          <select required name="show_id" id="showSelect"></select>
        </div>

        <div class="form-row--two">
          <div class="form-row">
            <label>Datum *</label>
            <input required type="date" name="performance_date">
          </div>
          <div class="form-row">
            <label>Ura *</label>
            <input required type="time" name="performance_time" value="20:00">
          </div>
        </div>

        <div class="form-row">
          <label>Status *</label>
          <select required name="status">
            <option value="scheduled">Načrtovano</option>
            <option value="sold_out">Razprodano</option>
            <option value="cancelled">Odpovedano</option>
          </select>
        </div>

        <div class="form-row">
          <label>Opomba (interno)</label>
          <input type="text" name="notes" placeholder="Neobvezno">
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn--danger" id="deleteBtn" onclick="deleteRow()" style="margin-right:auto;">Izbriši</button>
          <button type="button" class="btn btn--secondary" onclick="showList()">Prekliči</button>
          <button type="submit" class="btn btn--primary">Shrani</button>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
<script src="js/termini-page.js"></script>

</body>
</html>
