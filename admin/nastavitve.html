<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>Nastavitve — Admin Zarja</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__brand">
      <img src="../img/zarja_logo.png" alt="Zarja">
      <span class="tag">Admin</span>
    </div>
    <nav class="admin-nav">
      <ul>
        <li><a href="index.html"><span class="icon">⌂</span>Nadzorna plošča</a></li>
        <li><a href="predstave.html"><span class="icon">🎭</span>Predstave</a></li>
        <li><a href="termini.html"><span class="icon">📅</span>Termini</a></li>
        <li><a href="ansambel.html"><span class="icon">👥</span>Članstvo</a></li>
        <li><a href="nagrade.html"><span class="icon">🏆</span>Nagrade</a></li>
        <li><a href="sponzorji.html"><span class="icon">💎</span>Sponzorji</a></li>
        <li><a href="rezervacije.html"><span class="icon">🎟</span>Rezervacije</a></li>
        <li><a href="nastavitve.html" class="active"><span class="icon">⚙</span>Nastavitve</a></li>
        <li><a href="skrbniki.html"><span class="icon">🔑</span>Skrbniki</a></li>
      </ul>
    </nav>
    <div class="admin-sidebar__footer">
      <div class="admin-user">Prijavljen kot:<br><strong id="adminUserEmail">…</strong></div>
      <button onclick="admin.signOut()">Odjava</button>
    </div>
  </aside>

  <main class="admin-content">
    <div class="admin-header">
      <div>
        <h1>Nastavitve</h1>
        <p class="sub">Kontaktni podatki, naslovi, besedila na domači strani.</p>
      </div>
      <button class="btn btn--primary" id="saveBtn" onclick="saveAll()">Shrani spremembe</button>
    </div>

    <form id="settingsForm" class="admin-form" onsubmit="event.preventDefault(); saveAll();">
      <div id="settingsBody">
        <p style="text-align:center; padding:2rem; color:var(--c-muted);">Nalagam …</p>
      </div>
    </form>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
